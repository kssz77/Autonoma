<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Practica de formulario con diferentes tipos de datos">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="estilo.css">
    <title>Formulario</title>
</head>

<body class="contenedor">
    <header>
        <h1>Formulario de datos</h1>
    </header>

    <main>
        <form name="datos">
            <label for="numero"> Seleccione un número: </label><br>
            <input type="number" id="numero" required><br>
            <label for="correo"> Ingrese su correo: </label><br>
            <input type="email" id="correo" placeholder="example@email.com" required><br>
            <label for="nombre"> Ingrese su nombre: </label><br>
            <input type="text" id="nombre" placeholder="Ejemplo: Juan" required><br>
            <label for="apellido"> Ingrese su apellido: </label><br>
            <input type="text" id="apellido" placeholder="Ejemplo: Pérez" required><br>
            <label for="fecha_nacimiento"> Ingrese su fecha de nacimiento: </label><br>
            <input type="date" id="fecha_nacimiento" required><br>
            <label for="pagina_web"> Ingrese su página web: </label><br>
            <input type="URL" id="pagina_web" placeholder="https://example.com" required><br>
            <fieldset>
                <legend>¿Qué estándares conoces?</legend>
                <input type="checkbox" id="html5" checked>
                <label for="html5">HTML 5</label><br>
                <input type="checkbox" id="css3">
                <label for="css3">CSS3</label><br>
                <input type="checkbox" id="javascript">
                <label for="javascript">JavaScript</label><br>
            </fieldset>
            <label for="frase">Ingrese su frase celebre favorita: </label><br>
            <textarea Cols="20" rows="6" id="frase" placeholder="Ejemplo: Pienso, luego existo."></textarea><br>
            <button type="submit">Enviar datos </button>
        </form>
    </main>
    <footer aria-label="Enlace de regreso a la página de inicio">
        <a href="Inicio.html">Regresar a la página de inicio</a>
    </footer>

</body>

</html>
