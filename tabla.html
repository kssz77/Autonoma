<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Practica de tablas con un horario de clases">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body class="contenedor">
    <header>
        <h1> Tabla de horario </h1>
    </header>
    <main>
        <table>
            <caption> Horario de clases </caption>
            <tr>
                <th scope="col">Hora </th>
                <th scope="col">Lunes </th>
                <th scope="col">Martes </th>
                <th scope="col">Miercoles </th>
                <th scope="col">Jueves </th>
                <th scope="col">Viernes </th>
            </tr>
            <tr>
                <th scope="row">7:00 </th>
                <td>Frances </td>
                <td>Ingles </td>
                <td>Literatura </td>
                <td>Ciudadania </td>
                <td>Matematicas </td>
            </tr>

            <tr>
                <th scope="row">9:30 </th>
                <td>Dibujo </td>
                <td>Quimica </td>
                <td>E. Fisica </td>
                <td>Biologia </td>
                <td>Emprendimiento </td>
            </tr>

            <tr>
                <th scope="row">12:00 </th>
                <td>Fisica </td>
                <td>Musica </td>
                <td>Filosofia </td>
                <td>F. Cristiana </td>
                <td>Historia </td>
            </tr>
        </table>
    </main>
</body>

</html>
